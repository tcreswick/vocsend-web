[package]
name = "vocsend-web"
version = "0.1.0"
edition = "2021"
authors = ["Tim Creswick"]
description = "vocsend in the browser: transmit data between air-gapped devices using audio"
license = "MIT"
repository = "https://github.com/tcreswick/vocsend-web"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The protocol itself: the same library the command-line vocsend is built on.
vocsend = { git = "https://github.com/tcreswick/vocsend", default-features = false }
wasm-bindgen = "=0.2.130"
# In a browser, random numbers come from the page's crypto API.
getrandom = { version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
